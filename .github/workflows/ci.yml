name: CI

on:
  push:
    branches: [main, 'wip/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, typecheck, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  specs:
    name: Especificação e rastreabilidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2 jsonschema==4.23.0
      - run: python quality/check_specs.py
      - name: implementation-status.md atualizado
        run: |
          python quality/status.py
          git diff --exit-code implementation-status.md

  esp32-core:
    name: Núcleo de segurança do ESP32 (C, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C apps/esp32-demo test

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android (testes + APK debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e build
        working-directory: apps/android
        run: gradle --no-daemon :core:domain:test :core:network:test :device:miband3:test :app:testPadraoDebugUnitTest :app:assemblePadraoDebug :app:assembleCompletoDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-debug-apks
          path: apps/android/app/build/outputs/apk/**/*.apk
