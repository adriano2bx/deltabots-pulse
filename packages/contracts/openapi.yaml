openapi: 3.1.0
info:
  title: DeltaBots Pulse API
  version: 1.1.0
  description: Contrato normativo inicial de desenvolvimento; implementações devem cumprir RBAC/ABAC e LGPD definidos
    nos documentos.
servers:
- url: https://api.pulse.deltabots.com.br/v1
  description: Domínio proposto (não provisionado)
security:
- bearerAuth: []
tags:
- name: Auth
- name: User
- name: Organizations
- name: Devices
- name: Gateways
- name: Telemetry
- name: Health
- name: Automations
- name: Gestures
- name: Control
- name: Family
- name: Notifications
- name: AI
- name: Integrations
- name: Billing
- name: Admin
- name: Realtime
- name: Themes
