components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - trace_id
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        trace_id:
          type: string
    User:
      type: object
      required:
      - id
      - email
      - locale
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type: string
        timezone:
          type: string
    AuthTokens:
      type: object
      required:
      - access_token
      - expires_in
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
    Consent:
      type: object
      required:
      - id
      - purpose
      - granted_at
      properties:
        id:
          type: string
        purpose:
          type: string
        scope:
          type: object
        granted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    Device:
      type: object
      required:
      - id
      - model
      - transport
      properties:
        id:
          type: string
        model:
          type: string
        alias:
          type: string
        firmware:
          type: string
        transport:
          type: string
        last_seen_at:
          type: string
          format: date-time
        gateway_id:
          type: string
    Capability:
      type: object
      required:
      - id
      - support_state
      properties:
        id:
          type: string
        support_state:
          type: string
          enum:
          - SUPPORTED
          - UNSUPPORTED
          - UNVERIFIED
          - TEMPORARILY_UNAVAILABLE
        firmware:
          type: string
        verified_at:
          type: string
          format: date-time
        test_artifact:
          type: string
    TelemetryReading:
      type: object
      additionalProperties: false
      required:
      - reading_id
      - kind
      - observed_at
      - value
      - unit
      - quality
      - source
      properties:
        reading_id:
          type: string
          minLength: 6
          maxLength: 100
        kind:
          type: string
          enum:
          - heart_rate_bpm
          - steps_delta
          - steps_total
          - sleep_interval
          - activity
          - battery_percent
          - connection_state
        observed_at:
          type: string
          format: date-time
        value:
          oneOf:
          - type: number
          - type: string
          - type: object
        unit:
          type: string
          maxLength: 32
        quality:
          type: string
          enum:
          - measured
          - estimated
          - invalid
          - stale
        source:
          type: string
        firmware:
          type: string
        device_monotonic_ns:
          type: integer
          minimum: 0
    TelemetryBatch:
      type: object
      additionalProperties: false
      required:
      - gateway_id
      - device_id
      - batch_id
      - readings
      properties:
        gateway_id:
          type: string
        device_id:
          type: string
        batch_id:
          type: string
        readings:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryReading'
          minItems: 1
          maxItems: 200
    TelemetryBatchAck:
      type: object
      required:
      - batch_id
      - accepted
      - duplicates
      - rejected
      - server_time
      properties:
        batch_id:
          type: string
        accepted:
          type: array
          items:
            type: string
        duplicates:
          type: array
          items:
            type: string
        rejected:
          type: array
          items:
            type: object
            properties:
              reading_id:
                type: string
              code:
                type: string
        server_time:
          type: string
          format: date-time
    Automation:
      type: object
      required:
      - id
      - title
      - enabled
      - version
      - ast
      properties:
        id:
          type: string
        title:
          type: string
        enabled:
          type: boolean
        version:
          type: integer
        ast:
          type: object
    ControlSession:
      type: object
      required:
      - id
      - equipment_id
      - state
      - expires_at
      properties:
        id:
          type: string
        equipment_id:
          type: string
        state:
          type: string
          enum:
          - DISARMED
          - ARM_REQUESTED
          - ARMED
          - EXPIRED
          - FAULT
        expires_at:
          type: string
          format: date-time
    ControlCommand:
      type: object
      required:
      - command_id
      - session_id
      - equipment_id
      - action
      - expires_at
      - idempotency_key
      properties:
        command_id:
          type: string
        session_id:
          type: string
        equipment_id:
          type: string
        action:
          type: string
        arguments:
          type: object
        expires_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
    WssTicket:
      type: object
      required:
      - ticket
      - expires_at
      properties:
        ticket:
          type: string
        expires_at:
          type: string
          format: date-time
    ListResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            type: object
        next_cursor:
          type:
          - string
          - 'null'
    ItemResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
    JobResponse:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
        status:
          type: string
    ThemeSummary:
      type: object
      required:
      - theme_id
      - name
      - status
      properties:
        theme_id:
          type: string
        name:
          type: string
        status:
          type: string
        description:
          type: string
    ThemeRelease:
      type: object
      required:
      - id
      - theme_id
      - version
      - state
      properties:
        id:
          type: string
        theme_id:
          type: string
        version:
          type: string
        state:
          type: string
        manifest:
          type: object
          additionalProperties: true
    ThemeInstall:
      type: object
      required:
      - id
      - device_id
      - release_id
      - status
      properties:
        id:
          type: string
        device_id:
          type: string
        release_id:
          type: string
        status:
          type: string
        error_code:
          type: string
        updated_at:
          type: string
          format: date-time
    ThemeInstallEvent:
      type: object
      required:
      - event_id
      - attempt_id
      - device_id
      - release_id
      - seq
      - phase
      - status
      - observed_at
      properties:
        event_id:
          type: string
          minLength: 1
        attempt_id:
          type: string
          minLength: 1
        device_id:
          type: string
          minLength: 1
        release_id:
          type: string
          minLength: 1
        seq:
          type: integer
          minimum: 0
        phase:
          enum:
          - download
          - validation
          - preflight
          - transfer
          - device_processing
          - reconnect
          - postcheck
          - recovery
        status:
          enum:
          - IN_PROGRESS
          - VERIFIED_INSTALLED
          - TRANSFER_COMPLETE_UNVERIFIED
          - FAILED
          - RECOVERY_REQUIRED
          - CANCELLED
          - INTERRUPTED
        observed_at:
          type: string
          format: date-time
        confirmed_bytes:
          type: integer
          minimum: 0
        total_bytes:
          type: integer
          minimum: 0
        error_code:
          type: string
          maxLength: 100
        evidence_ref:
          type: string
          maxLength: 256
    ThemeDownloadTicket:
      type: object
      required:
      - url
      - expires_at
      - artifact_sha256
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        artifact_sha256:
          type: string
    ThemeCompatibility:
      type: object
      required:
      - compatible
      - reason
      properties:
        compatible:
          type: boolean
        reason:
          type: string
        verified_on_hardware:
          type: boolean
        variant_code:
          type: string
